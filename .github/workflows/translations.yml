name: Bilingual book checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Chinese and English editions
        run: python3 scripts/check_translations.py
